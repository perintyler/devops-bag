version: 1
name: daily-pr-summary
description: Summarize today's PR activity — opened, in-review, shipped, closed, and drafts — using GitHub CLI. Use when the user asks for a daily PR report, daily PR summary, or Slack-ready PR list.
prompt: |-
  # Daily PR Summary

  Generate a Slack-ready summary of the user's PR activity for today.

  ## Time zone handling

  "Today" always means the user's **local calendar day**, not UTC. All external APIs (GitHub, Linear, Slack) return UTC timestamps. To avoid missing PRs created or closed late in the local day:

  1. Compute `TODAY` and `TOMORROW` in local time.
  2. Use the date range `$TODAY..$TOMORROW` for all GitHub search queries.
  3. After fetching results from **any** source (GitHub, Linear, etc.), compare each item's UTC timestamp against the user's local day boundaries and exclude items that fall outside.

  ## Quick workflow

  1. Set the date using the user's **local time zone** (not UTC). GitHub's `--created` and `--closed` filters use UTC dates, so PRs created late in the day locally may fall on the next UTC date. To catch these, search both today and tomorrow (UTC):

  ```bash
  TODAY="$(date +%Y-%m-%d)"
  TOMORROW="$(date -v+1d +%Y-%m-%d)"
  ```

  Then use date range filters like `--created "$TODAY..$TOMORROW"` and `--closed "$TODAY..$TOMORROW"` in the queries below to capture PRs from the full local day.

  2. Opened today (non-drafts):

  ```bash
  gh search prs --author @me --created "$TODAY..$TOMORROW" \
    --json number,title,url,repository,isDraft \
    --jq 'map(select(.isDraft | not))'
  ```

  3. Drafts today (to list under "Tomorrow (drafts)"):

  ```bash
  gh search prs --author @me --created "$TODAY..$TOMORROW" \
    --json number,title,url,repository,isDraft \
    --jq 'map(select(.isDraft))'
  ```

  4. Still open (older PRs you actually worked on today — not created today):

  The list of open PRs is unbounded and mostly stale, so it MUST be filtered by same-day activity. Two filters are needed, because neither alone is correct.

  First, narrow to PRs touched today at all:

  ```bash
  gh search prs --author @me --state open --updated "$TODAY..$TOMORROW" \
    --json number,title,url,repository,isDraft,createdAt,updatedAt
  ```

  Then confirm each candidate with **your own commits on its branch**, which is the only signal that means *you* worked on it:

  ```bash
  ME="$(gh api user --jq '.login')"   # NOT @me - see below
  BRANCH="$(gh pr view <number> --repo <owner/name> --json headRefName --jq '.headRefName')"
  gh api "repos/<owner/name>/commits?sha=$BRANCH&author=$ME&since=$SINCE&until=$UNTIL" \
    --jq "[.[] | select(.commit.author.date >= \"$SINCE\" and .commit.author.date < \"$UNTIL\")] | length"
  ```

  Include the PR only when the count is greater than zero.

  **Re-filter on author date; the API window is committer date.** `since`/`until` match the *committer* timestamp, which a rebase rewrites to now while the author timestamp keeps its original date. Trusting the raw `length` therefore resurrects any stale branch you rebased today: commits from weeks ago are counted as same-day work and the PR reads as verified. The `select()` above re-checks `.commit.author.date` against the same window, and is what makes the count mean "authored today".

  `since`/`until` must be the local day's real boundaries expressed in UTC. Derive them (see the reference implementation below) rather than writing a literal offset: bare local dates are read as UTC, and a hardcoded offset goes stale at the DST change. Either way the window shifts by an hour or more, and the failure is quiet - a late-evening commit is attributed to the wrong day and its PR just disappears from the report.

  **Why both filters.** `updatedAt` is not "you worked on it" - it bumps on someone else's comment, a label change, or a bot, so it over-includes. It also under-includes: a PR whose commit landed via merge can keep an old `updatedAt` while you genuinely pushed to it today. The commit check is the authority; the `--updated` search is only a cheap way to avoid checking every open PR.

  **`author=@me` does not work here.** The `@me` shorthand is a `gh search` feature; the commits REST API does not resolve it, and instead of erroring it returns an empty list. Hardcoding `@me` makes every PR look untouched and the report come back empty while appearing to work. Always resolve the login first with `gh api user --jq '.login'`.

  Handle these cases explicitly rather than letting them pass silently:

  - **Branch deleted (404 from the commits API).** Not evidence of no work. Fall back to `gh pr view <number> --json commits` and filter its commits by author and date; if that is also unavailable, list the PR and flag it as unverified.
  - **A zero count from an errored call.** `--jq 'length'` prints nothing on error, which is easy to read as `0`. Treat empty/non-numeric output as an ERROR to surface, never as "no activity" - otherwise a broken token silently produces a clean-looking, empty report.

  Reference implementation for this step:

  ```bash
  ME="$(gh api user --jq '.login')"
  # Local-day boundaries in UTC. Derived, not hardcoded: the offset changes
  # with DST, and a stale offset silently shifts the window by an hour.
  utc_midnight() {                     # local YYYY-MM-DD -> UTC instant
    local secs
    secs="$(date -j -f '%Y-%m-%d %H:%M:%S' "$1 00:00:00" +%s 2>/dev/null)" || return 1
    case "$secs" in ''|*[!0-9]*) return 1 ;; esac
    date -u -r "$secs" +%Y-%m-%dT%H:%M:%SZ
  }
  # Bail loudly. On failure the substitution would yield the epoch, and a
  # "since 1970" window matches every commit ever - re-including the exact
  # stale PRs this filter exists to exclude.
  SINCE="$(utc_midnight "$TODAY")"    || { echo "cannot derive local day start" >&2; exit 1; }
  UNTIL="$(utc_midnight "$TOMORROW")" || { echo "cannot derive local day end"   >&2; exit 1; }

  gh search prs --author @me --state open --updated "$TODAY..$TOMORROW" \
    --json number,title,url,repository,isDraft,createdAt \
  | jq -r '.[] | "\(.number)\t\(.repository.nameWithOwner)\t\(.isDraft)\t\(.title)"' \
  | while IFS=$'\t' read -r num repo draft title; do
      br=$(gh pr view "$num" --repo "$repo" --json headRefName --jq '.headRefName' 2>/dev/null)
      # Re-filter on author date: the API's since/until match committer date,
      # which a rebase rewrites to now - counting old commits as today's work.
      n=$(gh api "repos/$repo/commits?sha=$br&author=$ME&since=$SINCE&until=$UNTIL" \
            --jq "[.[] | select(.commit.author.date >= \"$SINCE\" and .commit.author.date < \"$UNTIL\")] | length" 2>/dev/null)
      case "$n" in
        ''|*[!0-9]*) echo "UNVERIFIED #$num $repo ($title)" >&2 ;;
        0)           ;;                       # no work today - omit
        *)           echo "$num|$repo|$draft|$title" ;;
      esac
    done
  ```

  **Sanity-check the filter before trusting a run.** Point the commit check at a PR you know you did not touch today and confirm it is excluded. A filter that excludes everything and a filter that is broken produce the same empty report. Prefer a stale branch you *rebased* today if you have one - that is the case the committer-date bug slips through, and a plain untouched branch will not catch it. When a PR does survive the filter, print the matched commit dates (`.commit.author.date`) before trusting the count; dates that are not today mean the author-date filter is not being applied.

  Filter out any PRs already captured by the "opened today" query (step 2) to avoid duplicates.

  5. Shipped today and closed today (use `--closed` since `--merged` is unreliable):

  ```bash
  gh search prs --author @me --closed "$TODAY..$TOMORROW" \
    --json number,title,url,closedAt,repository,state
  ```

  Then split the results:
  - `state == "merged"` -> Shipped today
  - `state == "closed"` -> Closed today

  6. For each **closed** (not merged) PR, fetch the last comment to use as the close reason:

  ```bash
  gh pr view <number> --repo <owner/name> --json comments --jq '.comments | last | .body'
  ```

  Truncate the comment to the first line/sentence for display. If it's a bot comment (e.g. linear-linkback), skip it and show no reason.

  7. For each PR, fetch the branch name:

  ```bash
  gh pr view <number> --repo <owner/name> --json headRefName --jq '.headRefName'
  ```

  If the branch contains a Linear ticket identifier (e.g. `ENG-1234`), use `mcp__linear-mcp__get_issue` to fetch the ticket. Append the Linear link after the PR link using format `(<LINEAR_URL|TICKET_ID>)`.

  ## Output format (default)

  Use Slack-native hyphen bullets (no numbering) with emojis:

  - `:git-open:` for opened today (non-drafts)
  - `:git-review:` for still open (older PRs, not created today)
  - `:git-merged:` for shipped today (merged)
  - `:git-draft:` for drafts
  - `:no_entry:` for closed today (not merged)
  - `:ladybug:` for bugs

  Bug tagging rule: prefix `:ladybug:` when the title contains "bug" or starts with "fix"/"bug" (case-insensitive).

  Output a single flat bulleted list with no section headers. Order: opened (non-draft), in-review (older open PRs), shipped (merged), drafts, closed. Closed always last.

  Use markdown link format `[text](url)`. Title is plain text (not bold). Separate title, PR link, and Linear link with ` | `.

  ```
  - :git-open: Title | [PR #123](URL) | [ENG-1234](LINEAR_URL)
  - :git-open: :ladybug: Title | [PR #124](URL)
  - :git-review: Title | [PR #125](URL) | [ENG-1235](LINEAR_URL)
  - :git-merged: Title | [PR #126](URL)
  - :git-draft: Title | [PR #127](URL)
  - :no_entry: Title — "close reason" | [PR #128](URL) | [ENG-5678](LINEAR_URL)
  ```

  ## Clipboard & Slack

  After generating the summary:
  1. Copy the full formatted output to the clipboard using `pbcopy` (using `[text](url)` markdown links)
  2. DM the summary to yourself using the `slack-myself` skill. For the Slack API message, convert links to Slack mrkdwn format: `<url|text>` instead of `[text](url)`
  3. Confirm both actions to the user

  ## Notes

  - Default scope is all repos the user can access.
  - **Every bullet must be a PR the user actually worked on today.** Being open is not activity. Never list an open or draft PR without same-day evidence, and never fall back to "recent-looking" hand-picking when a filter misbehaves - fix the filter, or mark the entry UNVERIFIED.
  - "Shipped today (merged)" uses `--closed` filtered by `state == "merged"` and can include older PRs.
  - No section headers. Single flat list.
  - **Dedup**: A PR may appear in multiple result sets. Show it only once, using the most final state. Priority: merged > closed > open (today) > in-review > draft. For example, a same-day turnaround PR appears only as merged, and a PR created today never appears in the in-review list.
  - For closed PRs, show the close reason in quotes after an em dash. If no meaningful comment exists, omit the reason.
